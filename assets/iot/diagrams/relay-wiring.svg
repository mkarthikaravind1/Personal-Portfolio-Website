ect x="380" y="110" width="170" height="190" rx="10" fill="#EEF0FF" stroke="#5C6BFF" stroke-width="1.5"/><text x="465.0" y="164.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Relay Module</text><text x="465.0" y="182.0" text-anchor="middle" font-size="12" fill="#5A5A72">5V, 1-channel</text><text x="465.0" y="200.0" text-anchor="middle" font-size="12" fill="#5A5A72"></text><text x="465.0" y="218.0" text-anchor="middle" font-size="12" fill="#5A5A72">VCC  GND  IN</text><text x="465.0" y="236.0" text-anchor="middle" font-size="12" fill="#5A5A72"></text><text x="465.0" y="254.0" text-anchor="middle" font-size="12" fill="#5A5A72">COM   NO   NC</text><path d="M246,150 L376,150" fill="none" stroke="#D64545" stroke-width="2" marker-end="url(#hD64545)"/><text x="310" y="142" text-anchor="middle" font-size="12" fill="#D64545" font-weight="700">5V → VCC</text><path d="M246,184 L376,184" fill="none" stroke="#1A1A2E" stroke-width="2" marker-end="url(#h1A1A2E)"/><text x="310" y="176" text-anchor="middle" font-size="12" fill="#1A1A2E" font-weight="700">GND → GND</text><path d="M246,218 L376,218" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="310" y="210" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">GPIO23 → IN</text><rect x="660" y="90" width="170" height="70" rx="10" fill="#FDECEC" stroke="#D64545" stroke-width="1.5"/><text x="745.0" y="120.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">230V AC Live</text><text x="745.0" y="138.0" text-anchor="middle" font-size="12" fill="#5A5A72">from the plug</text><rect x="660" y="240" width="170" height="70" rx="10" fill="#FFFBE6" stroke="#C9A227" stroke-width="1.5"/><text x="745.0" y="261.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Bulb</text><text x="745.0" y="279.0" text-anchor="middle" font-size="12" fill="#5A5A72">neutral returns</text><text x="745.0" y="297.0" text-anchor="middle" font-size="12" fill="#5A5A72">to the plug</text><path d="M660,125 L600,125 L600,250 L554,250" fill="none" stroke="#D64545" stroke-width="2" marker-end="url(#hD64545)"/><text x="600" y="116" text-anchor="middle" font-size="12" fill="#D64545" font-weight="700">Live → COM</text><path d="M554,280 L656,280" fill="none" stroke="#D64545" stroke-width="2" marker-end="url(#hD64545)"/><text x="605" y="298" text-anchor="middle" font-size="12" fill="#D64545" font-weight="700">NO → Bulb</text><text x="430" y="390" text-anchor="middle" font-size="12" fill="#D64545" font-weight="400">NO (normally open): the bulb stays OFF until GPIO23 goes HIGH. Wire the mains side with the plug pulled out.</text></svg>