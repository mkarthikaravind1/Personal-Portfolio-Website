<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Task 1 communication: browser to ESP32 over local Wi-Fi using HTTP"><title>Task 1 communication: browser to ESP32 over local Wi-Fi using HTTP</title><defs><marker id="hC9CCE0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9CCE0"/></marker><marker id="h2E8B57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="h5C6BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6BFF"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="30" y="30" width="200" height="90" rx="10" fill="#F6F7FB" stroke="#C9CCE0" stroke-width="1.5"/><text x="130.0" y="70.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Browser</text><text x="130.0" y="88.0" text-anchor="middle" font-size="12" fill="#5A5A72">laptop on same Wi-Fi</text><rect x="330" y="30" width="200" height="90" rx="10" fill="#F6F7FB" stroke="#C9CCE0" stroke-width="1.5"/><text x="430.0" y="61.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Wi-Fi Router</text><text x="430.0" y="79.0" text-anchor="middle" font-size="12" fill="#5A5A72">hotspot / access point</text><text x="430.0" y="97.0" text-anchor="middle" font-size="12" fill="#5A5A72">assigns 192.168.x.x</text><rect x="630" y="30" width="200" height="90" rx="10" fill="#EEF0FF" stroke="#5C6BFF" stroke-width="1.5"/><text x="730.0" y="61.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">ESP32</text><text x="730.0" y="79.0" text-anchor="middle" font-size="12" fill="#5A5A72">WebServer on port 80</text><text x="730.0" y="97.0" text-anchor="middle" font-size="12" fill="#5A5A72">e.g. 192.168.56.226</text><path d="M130,120 L130,365" fill="none" stroke="#C9CCE0" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M430,120 L430,365" fill="none" stroke="#C9CCE0" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M730,120 L730,365" fill="none" stroke="#C9CCE0" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M130,165 L724,165" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="430" y="157" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">1. GET /</text><path d="M730,205 L136,205" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#h2E8B57)"/><text x="430" y="197" text-anchor="middle" font-size="12" fill="#2E8B57" font-weight="700">2. 200 OK: HTML page with ON / OFF buttons</text><path d="M130,250 L724,250" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="430" y="242" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">3. Click ON: GET /on</text><rect x="580" y="272" width="270" height="32" rx="10" fill="#FFF3E6" stroke="#D9771A" stroke-width="1.5"/><text x="715.0" y="292.0" text-anchor="middle" font-size="12" font-weight="500" fill="#1A1A2E">4. handleOn(): digitalWrite(2, HIGH)</text><path d="M730,340 L136,340" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#h2E8B57)"/><text x="430" y="332" text-anchor="middle" font-size="12" fill="#2E8B57" font-weight="700">5. 200 OK: page shows "LED is ON"</text></svg>