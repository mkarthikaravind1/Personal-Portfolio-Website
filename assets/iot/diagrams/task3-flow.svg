<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Task 3 data flow: voice trigger through IFTTT and Adafruit IO to the ESP32"><title>Task 3 data flow: voice trigger through IFTTT and Adafruit IO to the ESP32</title><defs><marker id="hD9771A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9771A"/></marker><marker id="h5C6BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6BFF"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="60" width="160" height="100" rx="10" fill="#F6F7FB" stroke="#C9CCE0" stroke-width="1.5"/><text x="100.0" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Voice command</text><text x="100.0" y="114.0" text-anchor="middle" font-size="12" fill="#5A5A72">"Okay Google,</text><text x="100.0" y="132.0" text-anchor="middle" font-size="12" fill="#5A5A72">activate Bulb On"</text><rect x="250" y="60" width="160" height="100" rx="10" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.5"/><text x="330.0" y="105.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Google Assistant</text><text x="330.0" y="123.0" text-anchor="middle" font-size="12" fill="#5A5A72">TRIGGER (If This)</text><rect x="480" y="60" width="160" height="100" rx="10" fill="#EEF0FF" stroke="#5C6BFF" stroke-width="1.5"/><text x="560.0" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">IFTTT Applet</text><text x="560.0" y="114.0" text-anchor="middle" font-size="12" fill="#5A5A72">ACTION (Then That)</text><text x="560.0" y="132.0" text-anchor="middle" font-size="12" fill="#5A5A72">send data to feed</text><rect x="710" y="60" width="160" height="100" rx="10" fill="#EEF0FF" stroke="#5C6BFF" stroke-width="1.5"/><text x="790.0" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Adafruit IO</text><text x="790.0" y="114.0" text-anchor="middle" font-size="12" fill="#5A5A72">feed 'bulb' = ON</text><text x="790.0" y="132.0" text-anchor="middle" font-size="12" fill="#5A5A72">MQTT broker</text><rect x="920" y="60" width="160" height="100" rx="10" fill="#FFF3E6" stroke="#D9771A" stroke-width="1.5"/><text x="1000.0" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">ESP32</text><text x="1000.0" y="114.0" text-anchor="middle" font-size="12" fill="#5A5A72">subscribed to 'bulb'</text><text x="1000.0" y="132.0" text-anchor="middle" font-size="12" fill="#5A5A72">GPIO23 → relay</text><path d="M180,110 L246,110" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="215.0" y="100" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">speech</text><path d="M410,110 L476,110" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="445.0" y="100" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">applet runs</text><path d="M640,110 L706,110" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="675.0" y="100" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">HTTPS</text><path d="M870,110 L916,110" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="895.0" y="100" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">MQTT push</text><rect x="920" y="200" width="160" height="60" rx="10" fill="#FFFBE6" stroke="#C9A227" stroke-width="1.5"/><text x="1000.0" y="234.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Bulb ON</text><path d="M1000,160 L1000,196" fill="none" stroke="#D9771A" stroke-width="2" marker-end="url(#hD9771A)"/><text x="440" y="225" text-anchor="middle" font-size="12" fill="#5A5A72" font-weight="400">The ESP32 never needs a public IP: it keeps an outgoing MQTT connection open,</text><text x="440" y="245" text-anchor="middle" font-size="12" fill="#5A5A72" font-weight="400">so a cloud trigger reaches it without port forwarding or tunnels.</text></svg>