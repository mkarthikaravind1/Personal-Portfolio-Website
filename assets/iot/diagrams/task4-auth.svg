<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Authentication versus authorization in the Firebase dashboard"><title>Authentication versus authorization in the Firebase dashboard</title><defs><marker id="h2E8B57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="h5C6BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6BFF"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="30" y="110" width="150" height="80" rx="10" fill="#F6F7FB" stroke="#C9CCE0" stroke-width="1.5"/><text x="105.0" y="136.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">User</text><text x="105.0" y="154.0" text-anchor="middle" font-size="12" fill="#5A5A72">email + password</text><text x="105.0" y="172.0" text-anchor="middle" font-size="12" fill="#5A5A72">or Google</text><rect x="250" y="50" width="260" height="190" rx="10" fill="#EEF0FF" stroke="#5C6BFF" stroke-width="1.5"/><text x="380.0" y="104.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">AUTHENTICATION</text><text x="380.0" y="122.0" text-anchor="middle" font-size="12" fill="#5A5A72">Who are you?</text><text x="380.0" y="140.0" text-anchor="middle" font-size="12" fill="#5A5A72"></text><text x="380.0" y="158.0" text-anchor="middle" font-size="12" fill="#5A5A72">Firebase Authentication</text><text x="380.0" y="176.0" text-anchor="middle" font-size="12" fill="#5A5A72">checks the credentials and</text><text x="380.0" y="194.0" text-anchor="middle" font-size="12" fill="#5A5A72">issues an ID token (uid)</text><rect x="580" y="50" width="290" height="190" rx="10" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.5"/><text x="725.0" y="104.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">AUTHORIZATION</text><text x="725.0" y="122.0" text-anchor="middle" font-size="12" fill="#5A5A72">What may you do?</text><text x="725.0" y="140.0" text-anchor="middle" font-size="12" fill="#5A5A72"></text><text x="725.0" y="158.0" text-anchor="middle" font-size="12" fill="#5A5A72">Firestore Security Rules</text><text x="725.0" y="176.0" text-anchor="middle" font-size="12" fill="#5A5A72">check request.auth on</text><text x="725.0" y="194.0" text-anchor="middle" font-size="12" fill="#5A5A72">every read and write</text><path d="M180,150 L246,150" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="213" y="140" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">login</text><path d="M510,150 L576,150" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#h2E8B57)"/><text x="543" y="140" text-anchor="middle" font-size="12" fill="#2E8B57" font-weight="700">token</text><text x="380" y="275" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">No valid login → redirected to login.html</text><text x="725" y="275" text-anchor="middle" font-size="12" fill="#2E8B57" font-weight="700">logs: create + read only, never edit/delete</text></svg>