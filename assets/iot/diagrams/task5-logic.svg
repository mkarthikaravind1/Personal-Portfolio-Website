<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Task 5 automatic lighting decision logic with hysteresis"><title>Task 5 automatic lighting decision logic with hysteresis</title><defs><marker id="hD9771A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9771A"/></marker><marker id="h5C6BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6BFF"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="330" y="20" width="200" height="50" rx="10" fill="#F6F7FB" stroke="#C9CCE0" stroke-width="1.5"/><text x="430.0" y="49.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A2E">Every 2 s</text><rect x="300" y="96" width="260" height="60" rx="10" fill="#EEF0FF" stroke="#5C6BFF" stroke-width="1.5"/><text x="430.0" y="121.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A2E">Read LDR (average of 10)</text><text x="430.0" y="139.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A2E">+ read control/device</text><polygon points="430,175.0 540.0,215 430,255.0 320.0,215" fill="#EEF0FF" stroke="#5C6BFF" stroke-width="1.5"/><text x="430" y="212" text-anchor="middle" font-size="13" fill="#1A1A2E" font-weight="700">mode ==</text><text x="430" y="228" text-anchor="middle" font-size="13" fill="#1A1A2E" font-weight="700">automatic?</text><rect x="620" y="190" width="210" height="50" rx="10" fill="#F6F7FB" stroke="#C9CCE0" stroke-width="1.5"/><text x="725.0" y="210.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A2E">Bulb follows the</text><text x="725.0" y="228.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A2E">dashboard command</text><path d="M430,70 L430,92" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><path d="M430,156 L430,172" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><path d="M540,215 L616,215" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="578" y="207" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">no</text><polygon points="430,280.0 550.0,320 430,360.0 310.0,320" fill="#FFF3E6" stroke="#D9771A" stroke-width="1.5"/><text x="430" y="317" text-anchor="middle" font-size="13" fill="#1A1A2E" font-weight="700">LDR &lt; threshold − 50</text><text x="430" y="333" text-anchor="middle" font-size="13" fill="#1A1A2E" font-weight="700">(dark)?</text><path d="M430,255 L430,277" fill="none" stroke="#5C6BFF" stroke-width="2" marker-end="url(#h5C6BFF)"/><text x="450" y="270" text-anchor="middle" font-size="12" fill="#5C6BFF" font-weight="700">yes</text><rect x="620" y="295" width="210" height="50" rx="10" fill="#FFFBE6" stroke="#C9A227" stroke-width="1.5"/><text x="725.0" y="324.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A2E">Bulb ON</text><path d="M550,320 L616,320" fill="none" stroke="#D9771A" stroke-width="2" marker-end="url(#hD9771A)"/><text x="583" y="312" text-anchor="middle" font-size="12" fill="#D9771A" font-weight="700">yes</text><polygon points="430,390.0 550.0,430 430,470.0 310.0,430" fill="#FFF3E6" stroke="#D9771A" stroke-width="1.5"/><text x="430" y="427" text-anchor="middle" font-size="13" fill="#1A1A2E" font-weight="700">LDR &gt; threshold + 50</text><text x="430" y="443" text-anchor="middle" font-size="13" fill="#1A1A2E" font-weight="700">(bright)?</text><path d="M430,360 L430,387" fill="none" stroke="#D9771A" stroke-width="2" marker-end="url(#hD9771A)"/><text x="448" y="378" text-anchor="middle" font-size="12" fill="#D9771A" font-weight="700">no</text><rect x="620" y="405" width="210" height="50" rx="10" fill="#F6F7FB" stroke="#C9CCE0" stroke-width="1.5"/><text x="725.0" y="434.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A2E">Bulb OFF</text><path d="M550,430 L616,430" fill="none" stroke="#D9771A" stroke-width="2" marker-end="url(#hD9771A)"/><text x="583" y="422" text-anchor="middle" font-size="12" fill="#D9771A" font-weight="700">yes</text><rect x="70" y="405" width="200" height="50" rx="10" fill="#F6F7FB" stroke="#C9CCE0" stroke-width="1.5"/><text x="170.0" y="425.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A2E">Keep current state</text><text x="170.0" y="443.0" text-anchor="middle" font-size="12" fill="#5A5A72">(dead band)</text><path d="M310,430 L274,430" fill="none" stroke="#D9771A" stroke-width="2" marker-end="url(#hD9771A)"/><text x="292" y="422" text-anchor="middle" font-size="12" fill="#D9771A" font-weight="700">no</text><text x="430" y="505" text-anchor="middle" font-size="12" fill="#5A5A72" font-weight="400">Threshold 500 → dark below 450, bright above 550. Readings from 450 to 550 change nothing,</text><text x="430" y="525" text-anchor="middle" font-size="12" fill="#5A5A72" font-weight="400">so light flickering near the limit cannot make the relay chatter.</text></svg>