<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - IoT Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-icon">🔐</div>
    <h1 id="formTitle">Welcome Back</h1>
    <p class="muted" id="formSub">Login to access your IoT Dashboard</p>

    <form id="authForm">
      <input type="email" id="email" placeholder="Email" autocomplete="email" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password"
        minlength="6" required>
      <button type="submit" class="btn-primary" id="submitBtn">Login</button>
    </form>

    <div class="divider">OR</div>
    <button class="btn-outline" id="googleBtn">Continue with Google</button>

    <p class="error" id="error" role="alert"></p>
    <p class="muted switch">
      <span id="switchText">Don't have an account?</span>
      <a href="#" id="switchLink">Create Account</a>
    </p>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
